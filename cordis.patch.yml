- insert:
    - id: thu-automad
      name: dsh-thu-automad
      config:
        credentialRef: TSINGHUA_API_KEY
        label: 清华 DeepSeek
        warnBeforeMs: 1800000
        refreshAheadMs: 3600000
        usernameRef: MADMODEL_USERNAME
        passwordRef: MADMODEL_PASSWORD
        transport:
          enabled: true
          mode: auto
          port: 43110
          keepaliveMs: 1200000
        tunnel: false
        rules:
          - when: { provider: [ tsinghua ], code: [ AUTH ] }
            action: renew
            onFailure: ask
            ask:
              question: "清华 token 续期没成功（{code}）。这次怎么走？"
              choices:
                - { label: "再试一次", action: retry }
                - {
                    label: "切到 deepseek-official",
                    action: switch,
                    to: { provider: deepseek-official, model: deepseek-flash }
                  }
                - { label: "这次放弃", action: fail }
              timeoutMs: 120000
              unavailable: { label: "放弃这一轮", action: fail }
          - when: { provider: [ tsinghua ], code: [ PI_AI_ERROR ] }
            action: ask
            afterRetries: 5
            ask:
              question: "清华网关把 tool call 参数截断了（{code}），自动重试已用尽。这次怎么走？"
              choices:
                - { label: "继续重试清华", action: retry }
                - {
                    label: "切到 deepseek-official",
                    action: switch,
                    to: { provider: deepseek-official, model: deepseek-flash }
                  }
                - { label: "这次放弃", action: fail }
              timeoutMs: 120000
              unavailable: { label: "放弃这一轮", action: fail }
          - when: { provider: [ tsinghua ], code: [ SERVER, TRANSPORT ] }
            action: ask
            ask:
              question: "清华网关请求失败（{code}）。这次怎么走？"
              choices:
                - { label: "继续重试清华", action: retry }
                - {
                    label: "切到 deepseek-official",
                    action: switch,
                    to: { provider: deepseek-official, model: deepseek-flash }
                  }
                - { label: "这次放弃", action: fail }
              timeoutMs: 120000
              unavailable: { label: "放弃这一轮", action: fail }

- id: llm-pi-ai
  config:
    providers:
      tsinghua:
        displayName: 清华 DeepSeek
        apiKeyEnv: TSINGHUA_API_KEY
        api: openai-completions
        baseURL: http://127.0.0.1:43110/v1
        timeoutMs: 3600000
        streamIdleTimeoutMs: 3600000
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens
        reasoning: high
        retryPolicy:
          mode: normal
          maxRetries: 5
          retryableCodes: [ EMPTY_RESPONSE, RATE_LIMIT, SERVER, TIMEOUT, TRANSPORT, PI_AI_ERROR ]
          backoff:
            initialDelayMs: 2000
            maxDelayMs: 30000
            jitterRatio: 0.1
        models:
          - id: DeepSeek-V4.1-Flash
            name: DeepSeek V4.1 Flash
            contextWindow: 1000000
            input: [ text, image ]
            reasoningEfforts:
              off: none
              low: low
              high: high
              max: max
          - id: qwen3.8-27b
            name: Qwen 3.8 27B
            contextWindow: 262144
            input: [ text, image ]
            reasoningEfforts:
              off: none
              low: low
              medium: medium
              high: xhigh
          - id: DeepSeek-R1-W8A8
            name: DeepSeek R1 W8A8
            contextWindow: 131072
            input: [ text ]
            reasoningEfforts:
              off: none
              low: low
              medium: medium
              high: high
